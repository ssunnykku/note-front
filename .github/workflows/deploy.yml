name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 타입/린트/포맷 검사. 실패하면 배포하지 않는다
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  deploy:
    needs: check
    # PR에서는 검사만 하고 배포는 main push일 때만
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm build의 `|| rm -rf build/server`는 Windows 로컬 빌드 우회용이라 빌드 실패도 성공으로 끝난다.
      # CI(Linux)에서는 react-router build를 직접 실행해 실패 시 배포를 멈춘다
      - name: Build
        run: pnpm exec react-router build

      - name: Verify build output
        run: test -f build/client/index.html

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # appleboy/scp-action, appleboy/ssh-action은 Docker 컨테이너 액션이라 러너 호스트의
      # tailscale0 인터페이스에 접근하지 못함. run: 스텝(호스트에서 직접 실행)으로 대체.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${{ secrets.HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Prepare remote directory
        run: ssh deploy-target 'mkdir -p /Users/dev/projects/note/deploy/front/dist'

      - name: Deploy static files to server
        run: |
          ssh deploy-target 'rm -rf /Users/dev/projects/note/deploy/front/dist/*'
          scp -r build/client/* deploy-target:/Users/dev/projects/note/deploy/front/dist/

      - name: Restart nginx to pick up new files
        run: |
          ssh deploy-target '
            export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
            export DOCKER_HOST="unix:///Users/dev/.colima/default/docker.sock"
            cd /Users/dev/projects/note/deploy/back/docker
            docker compose -f docker-compose.dev.yml up -d --force-recreate nginx
          '
