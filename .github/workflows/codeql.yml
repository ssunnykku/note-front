name: CodeQL

# JS/TS 보안 취약점 정적 분석 (XSS, 위험한 HTML 삽입 등). 결과는 Security 탭 > Code scanning에 표시
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # 매주 월요일 09:00 KST
    - cron: '0 0 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # 빌드 없이 소스만 분석
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
